# Datos de las revisiones de EE que el anexo no trae (T-24). Los usa carga_prueba.py.
#
# - code: año y mes del informe oficial (D-54); el anexo puede llamarse distinto (ver_Ago2026 → 2026-07).
# - published_on: cuando el informe no dice el día, el último día del mes de publicación (supuesto 4 del
#   issue #36); se marca «fecha aproximada» en notes y queda en X-23.
# - document_url: el informe oficial. Mientras no se confirme el enlace exacto de cada informe, la página
#   de la UPME (X-23).
# - model: lo que dice el informe; si no se tiene el informe, «por confirmar» (X-23).
# - data_cutoff, first_projected_period y horizon_end salen del anexo: el corte es el mes anterior al
#   primero de la hoja mensual.

