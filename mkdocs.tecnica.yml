site_name: Proyecciones de Demanda · Documentación técnica
docs_dir: docs
site_dir: site-tecnica
exclude_docs: |
  usuario/capturas/
theme: {name: material, language: es, features: [navigation.sections, navigation.indexes, search.highlight, content.code.copy]}
markdown_extensions:
  - admonition
  - tables
  - attr_list
  # Diagramas Mermaid: Material los dibuja si los bloques ```mermaid se marcan con la clase «mermaid».
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist: {custom_checkbox: true}
  - toc: {permalink: true}
nav:
  - Inicio: tecnica/index.md
  - Producto: producto/index.md
  - Técnica:
      - tecnica/flujo-de-trabajo-equipo.md
      - tecnica/referencias.md
      - tecnica/arquitectura.md
      - tecnica/frontend.md
      - tecnica/diseno-app.md
      - tecnica/reglas-proyecto.md
      - tecnica/modelo-de-datos.md
      - Base de datos:
          - tecnica/base-de-datos/index.md
          - tecnica/base-de-datos/raw.md
          - tecnica/base-de-datos/staging.md
          - tecnica/base-de-datos/core.md
          - tecnica/base-de-datos/publicacion.md
          - tecnica/base-de-datos/auth.md
          - tecnica/base-de-datos/operacion.md
          - tecnica/base-de-datos/convenciones.md
          - tecnica/base-de-datos/vistas.md
          - tecnica/base-de-datos/diccionario.md
          - Fuentes de datos:
              - tecnica/base-de-datos/fuentes/index.md
              - tecnica/base-de-datos/fuentes/plantilla-ficha.md
              - XM:
                  - tecnica/base-de-datos/fuentes/xm/guia-api-xm.md
                  - tecnica/base-de-datos/fuentes/xm/ficha-sinergox.md
                  - tecnica/base-de-datos/fuentes/xm/referencia/Diccionario_pydataxm.md
                  - tecnica/base-de-datos/fuentes/xm/referencia/Diccionario_SIMEM.md
                  - tecnica/base-de-datos/fuentes/xm/referencia/Fuentes_XM_Paratec_Sinergox_web.md
      - tecnica/api.md
      - tecnica/flujos.md
      - tecnica/versionado.md
      - tecnica/dependencias.md
      - tecnica/despliegue.md
      - Herramientas: tecnica/herramientas/index.md
  - Guía de usuario: usuario/index.md
  - Diario: diario/index.md
  - Decisiones: decisiones/index.md
  - Pendientes:
      - pendientes.md
