services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: proyecciones_demanda}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:5173"]
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  prefect-worker:
    build: ./pipelines
    env_file: .env
    depends_on:
      prefect-server: {condition: service_healthy}
      db: {condition: service_started}
volumes:
  db-data:
