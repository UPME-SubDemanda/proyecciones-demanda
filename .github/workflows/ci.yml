name: ci
on:
  pull_request:
    branches: [develop, main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v3
      - name: Changelog obligatorio (FLU-10)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'sin-changelog') }}
        run: python scripts/check_changelog.py origin/${{ github.base_ref }}
      - name: Lint de diseño (TOK-02)
        run: python scripts/lint_design.py frontend/src
      - name: Inventario completo (DOC-02)
        run: python scripts/inventario.py --check
      - name: Índice del diario al día (DOC-05)
        run: python scripts/diario.py --check
      - name: Mapa del repositorio al día (#29)
        run: python scripts/mapa.py --check
      - name: Referencias al día (T-20)
        run: python scripts/referencias.py --check
      - name: Pruebas backend
        working-directory: backend
        run: uv sync && uv run pytest -q
      - name: Pruebas pipelines
        working-directory: pipelines
        run: uv sync && uv run pytest -q
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - name: Pruebas frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false && pnpm test && pnpm build
      - name: Documentación
        run: uvx --with mkdocs-material mkdocs build --strict -f mkdocs.usuario.yml && uvx --with mkdocs-material mkdocs build --strict -f mkdocs.tecnica.yml

  # Base PostgreSQL de prueba (PBD-04): migraciones de ida y vuelta, comentarios y diccionario (PBD-01, PBD-03)
  # y pruebas del modelo de datos. Misma imagen que docker-compose.yml.
  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: proyecciones_demanda}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d proyecciones_demanda"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/proyecciones_demanda
      TEST_POSTGRES_URL: postgresql://app:app@localhost:5432/proyecciones_demanda
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Dependencias
        run: uv sync
      - name: Migraciones hacia arriba
        run: uv run alembic upgrade head
      - name: Comentarios y diccionario al día (PBD-01, PBD-03)
        run: uv run python ../scripts/diccionario.py --check
      - name: Pruebas del modelo de datos, de las vistas de core y de la API de datos
        run: uv run pytest -q tests/test_db_model.py tests/test_db_views.py tests/test_api_ee.py
      - name: Carga de XM contra la base, con XM simulado (T-28)
        working-directory: pipelines
        run: uv sync && uv run pytest -q tests/test_xm_load_db.py
      - name: Migraciones de ida y vuelta (PBD-04)
        run: uv run alembic downgrade base && uv run alembic upgrade head
